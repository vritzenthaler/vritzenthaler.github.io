en:
  meta_title: Valentin Ritzenthaler, applied mathematics and AI
  headline: Truth begins where easy answers end.
  annotation: ""
  intro: >-
    I'm Valentin, a doctor in applied mathematics based in Barcelona.
    After years developing numerical methods for electromagnetic simulation,
    I'm now moving into AI engineering. I'm drawn to questions that resist
    easy answers, and to the careful work of finding out what holds up.
  intro_link_label: Read my research
  blog_link_label: Explore my ideas
fr:
  meta_title: Valentin Ritzenthaler, mathématiques appliquées et IA
  headline: Truth begins where easy answers end.
  headline_lang: en
  annotation: ""
  intro: >-
    Je suis Valentin, docteur en mathématiques appliquées, installé à Barcelone.
    Après plusieurs années à développer des méthodes numériques pour la simulation
    électromagnétique, je me tourne aujourd’hui vers l’ingénierie de l’IA. Je suis attiré
    par les questions qui résistent aux réponses faciles, et par le travail patient
    qui consiste à vérifier ce qui tient vraiment.
  intro_link_label: Lire mes recherches
  blog_link_label: Découvrir mes idées
